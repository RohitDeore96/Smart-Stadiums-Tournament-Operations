# ==============================================================
# Deploy Pipeline — Vercel (frontend + serverless API)
# --------------------------------------------------------------
# Triggers on push to main (after CI passes).
# Deploys both the Vite frontend and the /api serverless functions to Vercel.
#
# Required GitHub Secrets:
#   VERCEL_TOKEN         Vercel personal access token
#   VERCEL_ORG_ID        Vercel org/team ID
#   VERCEL_PROJECT_ID    Vercel project ID
#   GEMINI_API_KEY       Gemini API key (set as Vercel env var on first deploy)
# ==============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----- Gate: only run deploy if secrets are configured -----
  check-secrets:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && \
             [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && \
             [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
            echo "✅ Vercel secrets present"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Vercel secrets not configured — skipping deploy."
            echo "    See README §'Vercel Setup' for instructions."
          fi

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has-secrets == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test deployment
        run: |
          echo "Waiting 15s for deployment to propagate..."
          sleep 15
          # Get the deployment URL from Vercel (or use the known production URL)
          DEPLOY_URL="https://smart-stadiums-tournament-operation-nine.vercel.app"
          echo "Testing health endpoint at $DEPLOY_URL/api/health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$DEPLOY_URL/api/health" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment healthy (HTTP 200)"
          else
            echo "⚠️  Health check returned HTTP $STATUS — deployment may still be propagating"
          fi
