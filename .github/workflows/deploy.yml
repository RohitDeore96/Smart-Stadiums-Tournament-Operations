# ==============================================================
# Deploy Pipeline — runs on push to main after CI passes
# --------------------------------------------------------------
# Deploys:
#   1. Backend Docker image → Artifact Registry → Cloud Run
#   2. Frontend build → Firebase Hosting
#
# Required GitHub Secrets (set these in repo Settings → Secrets):
#   GCP_PROJECT_ID      e.g. stadiumops-ai-dev
#   GCP_SA_KEY          JSON key for github-deployer service account
#   FIREBASE_TOKEN      from `firebase login:ci`
#   GEMINI_API_KEY      (only used in dev; prod reads from Secret Manager)
# ==============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never cancel a mid-deploy

jobs:
  # ----- Job 1: backend → Cloud Run -----
  deploy-api:
    name: Build & Deploy API → Cloud Run
    runs-on: ubuntu-latest
    needs: [] # could depend on a ci-pass gate
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      ARTIFACT_REPO: stadiumops
      SERVICE_NAME: stadiumops-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Optional: use Workload Identity Federation for prod (more secure than JSON keys)
          # See https://github.com/google-github-actions/auth#workload-identity-federation

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${GCP_REGION}-docker.pkg.dev --quiet

      - name: Build container image
        run: |
          docker build \
            --file apps/api/Dockerfile \
            --tag ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:${IMAGE_TAG} \
            --tag ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:latest \
            .

      - name: Push container image
        run: |
          docker push ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:${IMAGE_TAG}
          docker push ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE_NAME} \
            --image ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:${IMAGE_TAG} \
            --region ${GCP_REGION} \
            --project ${GCP_PROJECT_ID} \
            --platform managed \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 60 \
            --concurrency 80 \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production,LOG_LEVEL=info \
            --set-secrets GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --service-account stadiumops-api-runner@${GCP_PROJECT_ID}.iam.gserviceaccount.com

      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe ${SERVICE_NAME} --region ${GCP_REGION} --format 'value(status.url)')
          echo "✅ API deployed to: $URL"
          echo "API_URL=$URL" >> $GITHUB_ENV

  # ----- Job 2: frontend → Firebase Hosting -----
  deploy-web:
    name: Build & Deploy Web → Firebase Hosting
    runs-on: ubuntu-latest
    needs: deploy-api
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @stadiumops/web build
        env:
          # Public, non-secret Firebase web config — safe in CI logs
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: https://${{ secrets.GCP_PROJECT_ID }}-run.firebaseapp.com

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          channelId: live
          entryPoint: apps/web
