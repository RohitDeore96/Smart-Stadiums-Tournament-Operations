# ==============================================================
# CI Pipeline — runs on every PR and every push to main
# --------------------------------------------------------------
# Goal: fail fast on quality / security / a11y regressions before deploy.
# ==============================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for change-based caching
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint (all workspaces)
        run: pnpm lint

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test
        env:
          NODE_ENV: test
          GEMINI_API_KEY: test-key-mock-do-not-use
          FIREBASE_PROJECT_ID: stadiumops-test

      - name: Security audit (dependencies)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Build all workspaces
        run: pnpm build
