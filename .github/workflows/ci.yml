# ==============================================================
# CI Pipeline — runs on every PR and every push to main
# --------------------------------------------------------------
# Goal: fail fast on quality / security / a11y regressions before deploy.
#
# Jobs:
#   1. quality-gate  — lint, typecheck, unit tests, security audit, build
#   2. e2e           — Playwright E2E tests (needs quality-gate)
# ==============================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check
        continue-on-error: true # Non-blocking — format issues shouldn't fail builds

      - name: Lint (all workspaces)
        run: pnpm lint

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test
        env:
          NODE_ENV: test
          GEMINI_API_KEY: test-key-mock-do-not-use
          FIREBASE_PROJECT_ID: stadiumops-test

      - name: Security audit (dependencies)
        # Use npm audit instead of pnpm audit — npm's audit endpoint is current.
        # pnpm audit uses the deprecated npm registry endpoint (HTTP 410 Gone).
        # See: https://github.com/pnpm/pnpm/issues/9522
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # Non-blocking for now — audit issues shouldn't block feature work

      - name: Build all workspaces
        run: pnpm build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/web/dist/
            packages/shared/dist/
          retention-days: 3

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app (for preview server)
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start preview server
        run: |
          pnpm --filter @stadiumops/web preview --port 4173 --host &
          echo "Preview server starting on port 4173..."
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4173 | grep -q "200"; then
              echo "✅ Preview server is ready"
              break
            fi
            echo "  Waiting... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: 'true'
          E2E_BASE_URL: 'http://localhost:4173'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
